repos:
- repo: https://github.com/gherynos/pre-commit-java
  rev: v0.2.4
  hooks:
  - id: Checkstyle
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.16.3
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
# The CI Guardrail Drift check, locally (#869). Runs a clean test-compile, so only when a file
# that can change the guardrails is staged. Whitespace-only differences are ignored here, since a
# regeneration on another OS can differ from CI's in those alone; CI stays byte-exact.
- repo: local
  hooks:
  - id: guardrail-drift
    name: guardrail files match the @AI* annotations
    entry: sh tools/guardrail-drift.sh --ignore-whitespace
    language: system
    pass_filenames: false
    files: '(\.java|CLAUDE\.md|GEMINI\.md|AGENTS\.md|\.claudeignore|\.vibetags-[a-z-]+)$|(^|/)\.claude/rules/|^\.gemini/'
