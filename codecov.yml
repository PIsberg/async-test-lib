codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    # New code, the condition SonarQube's agentic-AI quality gate sets: at least 80% of the lines
    # a pull request adds are covered (docs/quality-gates/new-code-gate.md). Measured against the
    # combined library-and-agent report since #1482; before it, agent work read as untested.
    patch:
      default:
        target: 80%
        informational: false

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true

ignore:
  - "**/test/**"
  - "**/tests/**"
  - "**/*Test.java"
  - "**/*Tests.java"
  - "examples/**"
  - "consumer-fixture/**"
