version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # codeql-action's init/analyze/upload-sarif steps must run the SAME
    # version — separate per-step bump PRs fail CI with "Loaded a
    # configuration file for version X, but running version Y".
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Every Maven build in one entry: the reactor, and the builds outside it, which all take their
  # versions from versions/pom.xml (a property declared there is updated there, whichever
  # directory's pom uses it). versions/pom.xml repeats five of the reactor's properties (JUnit
  # Jupiter and Platform, Surefire, the compiler plugin, slf4j), and SatelliteVersionsTest fails
  # when the two disagree. Two entries would bump each copy in its own PR, and each of those PRs
  # would fail that test on its own. group-by: dependency-name opens one PR per dependency across
  # every directory below, so a shared bump edits both poms together and stays green.
  #
  # The outside builds were missing from Dependabot entirely until #958: corpus-eval's
  # jackson-databind sat on two high advisories for a week with no PR. The library's own version
  # is left to the release skill. A corpus subject bump can move the measured numbers: rerun the
  # corpus lanes before merging one.
  - package-ecosystem: maven
    directories:
      - /
      - /consumer-fixture
      - /consumer-fixture-langs
      - /corpus-eval
      - /examples
      - /async-test-maven-plugin
    schedule:
      interval: daily
    ignore:
      - dependency-name: "se.deversity.async-test-lib:*"
    groups:
      per-dependency:
        group-by: dependency-name

  # The Copilot CLI instruction-evals.yml installs with npm ci from this lockfile (#959). It sat
  # under .github/copilot-cli until #1029: there, every run resolved the bump and then had its
  # create_pull_request refused with a 400 ("invalid or unauthorized changes"), so no PR was ever
  # opened. vibetags keeps the same kind of pin at /tools/codex-cli and gets its PRs.
  # DependabotNpmPinTest keeps npm entries out of .github/.
  - package-ecosystem: npm
    directory: /tools/copilot-cli
    schedule:
      interval: weekly

  # Gradle-only versions. Everything the Gradle builds share with Maven is read from pom.xml (the
  # reactor) or versions/pom.xml (the builds outside it), so the maven entry above already covers
  # it and this entry cannot raise a competing PR for it: those numbers are not literals in any
  # Gradle file.
  #
  # What is left here has no Maven twin and so had nothing else watching it: the root build's
  # Gradle plugins (vanniktech publish, errorprone, spotbugs, cyclonedx), the test-only logback
  # backend that `./gradlew test` needs and Maven does not, and load-tests' JMH plugin.
  - package-ecosystem: gradle
    directories:
      - /
      - /load-tests
      - /async-test-gradle-plugin
    schedule:
      interval: daily
