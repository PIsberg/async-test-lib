version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # codeql-action's init/analyze/upload-sarif steps must run the SAME
    # version — separate per-step bump PRs fail CI with "Loaded a
    # configuration file for version X, but running version Y".
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
