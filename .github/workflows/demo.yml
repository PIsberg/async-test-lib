name: Update demo GIF

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install asciinema
        run: pip install asciinema

      - name: Install agg
        run: |
          curl -sL \
            https://github.com/asciinema/agg/releases/latest/download/agg-x86_64-unknown-linux-gnu \
            -o /usr/local/bin/agg
          chmod +x /usr/local/bin/agg

      - name: Build and install async-test-lib
        run: mvn install -DskipTests -q

      - name: Set demo project version
        run: |
          VERSION=$(mvn help:evaluate -q -DforceStdout -Dexpression=project.version)
          sed -i "s/<asynctest.version>.*<\/asynctest.version>/<asynctest.version>${VERSION}<\/asynctest.version>/" \
            tools/demo/pom.xml

      - name: Record demo
        run: |
          asciinema rec docs/diagrams/demo.cast \
            --command "bash tools/demo-commands.sh" \
            --cols 82 --rows 26 \
            --overwrite

      - name: Convert cast to GIF
        run: |
          agg docs/diagrams/demo.cast docs/diagrams/demo.gif \
            --font-size 14 \
            --speed 1.2 \
            --idle-time-limit 3

      - name: Open PR if GIF changed
        run: |
          if git status --porcelain docs/diagrams/demo.cast docs/diagrams/demo.gif | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            BRANCH="chore/update-demo-gif-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git add docs/diagrams/demo.cast docs/diagrams/demo.gif
            git commit -m "chore: update demo GIF"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore: update demo GIF" \
              --body "Auto-generated by the demo workflow." \
              --label documentation
          else
            echo "GIF unchanged — no PR needed"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
