name: Update demo GIF

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install asciinema
        run: pip install asciinema

      - name: Install agg
        run: |
          curl -sL \
            https://github.com/asciinema/agg/releases/latest/download/agg-x86_64-unknown-linux-gnu \
            -o /usr/local/bin/agg
          chmod +x /usr/local/bin/agg

      - name: Build and install async-test-lib
        run: mvn install -DskipTests -q

      - name: Set demo project version
        run: |
          VERSION=$(mvn help:evaluate -q -DforceStdout -Dexpression=project.version)
          sed -i "s/<asynctest.version>.*<\/asynctest.version>/<asynctest.version>${VERSION}<\/asynctest.version>/" \
            tools/demo/pom.xml

      - name: Record demo
        run: |
          asciinema rec docs/diagrams/demo.cast \
            --command "bash tools/demo-commands.sh" \
            --cols 82 --rows 26 \
            --overwrite

      - name: Convert cast to GIF
        run: |
          agg docs/diagrams/demo.cast docs/diagrams/demo.gif \
            --font-size 14 \
            --speed 1.2 \
            --idle-time-limit 3

      - name: Commit updated GIF to main
        # The workflow's `paths:` filter excludes docs/diagrams/, so pushing
        # the regenerated assets here will NOT re-trigger this workflow.
        # Direct push avoids the GITHUB_TOKEN "cannot create PR" restriction;
        # human review on auto-generated GIFs adds no value.
        run: |
          if git status --porcelain docs/diagrams/demo.cast docs/diagrams/demo.gif | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/diagrams/demo.cast docs/diagrams/demo.gif
            git commit -m "chore: update demo GIF [skip ci]"
            git push origin HEAD:main
          else
            echo "GIF unchanged — nothing to push"
          fi
