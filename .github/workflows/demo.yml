name: Update demo GIF

# Weekly, and on demand. It used to run on every qualifying merge to main, and since the
# recording is a live capture of a running JVM it proposed a pull request every time: five
# such commits landed between 2026-08-28 and 2026-09-03, each a diff of one binary and
# fourteen timing lines (#486). The comparison below now normalises the cast before deciding,
# which fixes the cause; the schedule bounds the rate as well, so a masking pattern that turns
# out to be too narrow costs one pull request a week rather than one per merge.
#
# Dispatch it by hand before a release, when the demo's output is the actual question.
on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Only the newest recording matters, so drop a superseded run instead of racing it. Not
# cancel-in-progress on a schedule, where there is nothing to supersede.
concurrency:
  group: demo-gif
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  record:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # pushes the recording to its own branch
      pull-requests: write   # opens the PR that carries it to main

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install asciinema
        run: pip install --require-hashes -r tools/demo/requirements.txt

      - name: Install agg
        run: |
          curl -sL \
            https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu \
            -o /usr/local/bin/agg
          echo "f111e315cd71056b116302342553dd765b7297579ed511f111d0cedb442aeda6  /usr/local/bin/agg" | sha256sum -c -
          chmod +x /usr/local/bin/agg

      - name: Build and install async-test-lib
        run: mvn install -DskipTests -q

      - name: Set demo project version
        run: |
          VERSION=$(mvn help:evaluate -q -DforceStdout -Dexpression=project.version)
          sed -i "s/<asynctest.version>.*<\/asynctest.version>/<asynctest.version>${VERSION}<\/asynctest.version>/" \
            tools/demo/pom.xml

      # Recorded beside the committed cast rather than over it, so the comparison below has
      # both to look at and an unchanged demo leaves the working tree untouched.
      - name: Record demo
        run: |
          asciinema rec "$RUNNER_TEMP/demo.cast" \
            --command "bash tools/demo-commands.sh" \
            --cols 82 --rows 26 \
            --overwrite

      # The decision, and the whole point of #486. A cast is a live capture: its header carries
      # the recording's wall clock, every event is prefixed with elapsed seconds, the split into
      # events follows PTY read timing, and the demo records an actual race that lands
      # differently each run. Comparing bytes therefore always differs. normalise-cast.py reduces
      # a cast to the text the demo says, with those four things masked; measured on the two
      # recordings from #483, 35 differing raw lines come out identical.
      - name: Decide whether the demo output actually changed
        id: compare
        run: |
          set -euo pipefail
          python3 tools/demo/normalise-cast.py docs/diagrams/demo.cast > "$RUNNER_TEMP/committed.txt"
          python3 tools/demo/normalise-cast.py "$RUNNER_TEMP/demo.cast" > "$RUNNER_TEMP/fresh.txt"
          if diff -u "$RUNNER_TEMP/committed.txt" "$RUNNER_TEMP/fresh.txt"; then
            echo "The demo says the same thing it said before - nothing to propose."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert cast to GIF
        if: steps.compare.outputs.changed == 'true'
        run: |
          cp "$RUNNER_TEMP/demo.cast" docs/diagrams/demo.cast
          agg docs/diagrams/demo.cast docs/diagrams/demo.gif \
            --font-size 14 \
            --speed 1.2 \
            --idle-time-limit 3

      - name: Propose the regenerated GIF as a pull request
        if: steps.compare.outputs.changed == 'true'
        # This step used to push straight to main, and had failed on every run
        # since branch protection went on: GH006, "Changes must be made through
        # a pull request". Its retry loop could not have helped either - it
        # rebased with tools/demo/pom.xml still modified by the version stamp
        # above, so git refused with "cannot rebase: You have unstaged changes".
        #
        # The comment it carried - "Direct push avoids the GITHUB_TOKEN cannot
        # create PR restriction" - described a real restriction, since lifted:
        # Settings > Actions > General > "Allow GitHub Actions to create and
        # approve pull requests" is on, so the token may open this PR.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The version stamp is a build-time mutation, not something to commit,
          # and leaving it dirty is what broke the old rebase.
          git checkout -- tools/demo/pom.xml

          BRANCH=chore/demo-gif
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/diagrams/demo.cast docs/diagrams/demo.gif
          git commit -m "chore: update demo GIF"

          # One long-lived branch, force-pushed. A recording runs per qualifying
          # merge to main, and a fresh branch per run would open a PR per merge;
          # reusing the branch means an open PR just gains a newer recording.
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR already open for $BRANCH - the force-push updated it"
            exit 0
          fi

          # printf rather than a heredoc: this is inside a YAML block scalar, so
          # a terminator at column 0 would end the block and every indented line
          # would reach GitHub as a markdown code block.
          printf '%s\n' \
            'The demo recording changed, so `docs/diagrams/demo.gif` and `docs/diagrams/demo.cast`' \
            'were re-recorded from the current `main`.' \
            '' \
            'Opened by the `Update demo GIF` workflow, which cannot commit to `main` directly:' \
            'branch protection requires a pull request.' \
            '' \
            'Nothing here is hand-written. Re-running the workflow force-pushes a newer recording' \
            'onto this same branch rather than opening a second pull request.' \
            > "$RUNNER_TEMP/demo-pr-body.md"

          gh pr create --base main --head "$BRANCH" \
            --title "chore: update the demo GIF" \
            --body-file "$RUNNER_TEMP/demo-pr-body.md"
