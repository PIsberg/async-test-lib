name: Guardrail Gates

# The three gates that keep the agent-facing guardrails honest. Each one turns a property
# that used to hold by habit into a property of every pull request:
#
#   guardrail-drift  the committed CLAUDE.md / GEMINI.md / .claude/rules / .gemini/rules /
#                    .claudeignore files are exactly what a clean build regenerates from the
#                    source annotations. Both builds regenerate them (vibetags annotation
#                    processor); until this job nothing ever checked whether the regenerated
#                    tree matched the committed one, so a hand edit inside the markers, or an
#                    annotation change committed without its regenerated files, was invisible.
#   locked-files     a PR diff that touches an @AILocked element (today: DetectorType) fails,
#                    naming the element and the lock's reason. Adding a detector legitimately
#                    touches it, so a maintainer who has reviewed the wiring applies the
#                    `lock-override` label and the guard drops to warn-only for that PR.
#                    The override is a human act on the PR page, never something the diff
#                    can grant itself.
#   diagrams         the code-karta SVGs under docs/diagrams/codekarta/ regenerate from the
#                    source and the job fails on structural drift. Introduced against a tree
#                    where 27 node titles had moved since the last regeneration.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guardrail-drift:
    name: Guardrail Drift
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The regeneration, the path list and the diff live in one script that the local
      # pre-commit hook runs too, so the two cannot disagree on which files count (#869).
      # No options here: CI is byte-exact.
      - name: Regenerate the guardrail files and fail if they differ from the committed ones
        run: sh tools/guardrail-drift.sh

  locked-files:
    name: Locked Files Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the guard diffs against the merge base

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Note when the maintainer has approved a locked edit
        if: contains(github.event.pull_request.labels.*.name, 'lock-override')
        run: |
          echo "lock-override label present: the guard reports but does not fail. A maintainer has taken responsibility for the @AILocked edit in this PR." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::lock-override label present; Locked Files Guard is warn-only for this PR."

      # Pinned to the vibetags commit that ships the guard; bump deliberately, like any
      # other action. The action touches .vibetags-locks (the processor's opt-in signal),
      # compiles the PR head so the report is fresh, and intersects the diff with it.
      - name: Guard @AILocked elements against this PR's diff
        uses: PIsberg/vibetags/action/locked-files@e3237596799baba9fad9951e7a72a7edc46d0021 # main 2026-08-15
        with:
          build-command: mvn -B -q clean compile -Djacoco.skip=true
          warn-only: ${{ contains(github.event.pull_request.labels.*.name, 'lock-override') && 'true' || 'false' }}

  diagrams:
    name: Architecture Diagram Drift
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Snapshot the committed diagrams' structure
        run: sh tools/diagram-structure.sh docs/diagrams/codekarta > "$RUNNER_TEMP/diagram-structure-committed.txt"

      - name: Regenerate the diagrams
        run: sh tools/generate-architecture-diagrams.sh

      # Structural, not byte-level: code-karta's directory walk follows filesystem order, so
      # node positions differ between the OS that committed and the OS that checks. The
      # sorted set of node titles is the deterministic part, and the part a drift gate
      # exists to pin. tools/diagram-structure.sh says what it does not cover.
      - name: Fail on structural drift
        run: |
          sh tools/diagram-structure.sh docs/diagrams/codekarta > "$RUNNER_TEMP/diagram-structure-fresh.txt"
          if ! diff -u "$RUNNER_TEMP/diagram-structure-committed.txt" "$RUNNER_TEMP/diagram-structure-fresh.txt"; then
            echo "::error::Architecture diagrams are stale: the code's shape moved and the committed pictures did not."
            echo "::error::Run: sh tools/generate-architecture-diagrams.sh   then commit the regenerated SVGs."
            exit 1
          fi
          echo "Diagram structure matches the code."

      - name: Upload regenerated diagrams
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-diagrams
          path: docs/diagrams/codekarta/
          if-no-files-found: ignore
