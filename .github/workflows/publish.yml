name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write  # required for keyless cosign signing via OIDC

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            central.sonatype.com:443
            fulcio.sigstore.dev:443
            github.com:443
            keys.openpgp.org:443
            keyserver.ubuntu.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rekor.sigstore.dev:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Generates ~/.m2/settings.xml with a <server id="central"> entry
          # used by central-publishing-maven-plugin to authenticate with the portal
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Import GPG key
        run: |
          echo "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Build, test and publish to Maven Central
        run: mvn --batch-mode clean deploy -P release
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Generate SBOM with CycloneDX
        # Same invocation as sbom.yml. skipNotDeployed=false is required because
        # cyclonedx-maven-plugin 2.9+ otherwise skips the goal whenever maven.deploy.skip
        # is effectively true, which would leave no target/bom.xml to sign and attach below.
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -Dcyclonedx.skipNotDeployed=false

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with cosign (keyless / OIDC)
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for artifact in \
            async-test-lib/target/async-test-lib-${VERSION}.jar \
            async-test-lib/target/async-test-lib-${VERSION}-sources.jar \
            async-test-lib/target/async-test-lib-${VERSION}-javadoc.jar \
            async-test-agent/target/async-test-agent-${VERSION}.jar \
            async-test-agent/target/async-test-agent-${VERSION}-sources.jar \
            async-test-agent/target/async-test-agent-${VERSION}-javadoc.jar \
            async-test-analysis/target/async-test-analysis-${VERSION}.jar \
            async-test-analysis/target/async-test-analysis-${VERSION}-sources.jar \
            async-test-analysis/target/async-test-analysis-${VERSION}-javadoc.jar \
            target/bom.xml \
            target/bom.json; do
            if [ -f "$artifact" ]; then
              # The bundle must end in .sigstore.json. Scorecard's releasesAreSigned probe
              # matches only .asc, .minisig, .sig, .sign, .sigstore and .sigstore.json, so
              # the ".bundle" suffix used through v1.7.3 was a signature it could not see —
              # Signed-Releases scored 0 on releases that were in fact all signed.
              cosign sign-blob --yes \
                --bundle "${artifact}.sigstore.json" \
                "${artifact}"
            fi
          done

      - name: Create GitHub Release with artifacts and signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # The primary artifact must exist; the unconditional file list used to fail the
          # job when it was missing, and a release without it would be a broken release.
          test -f "async-test-lib/target/async-test-lib-${VERSION}.jar"
          # The .asc files are the detached GPG signatures maven-gpg-plugin already produced
          # for Maven Central. Publishing them here as well costs nothing and gives consumers
          # the more widely verified of the two formats.
          # Candidate files are guarded with -f, matching the signing loop above, so an
          # artifact a future profile stops producing drops out of the release instead of
          # failing the job.
          files=()
          for f in \
            async-test-lib/target/async-test-lib-${VERSION}.jar \
            async-test-lib/target/async-test-lib-${VERSION}-sources.jar \
            async-test-lib/target/async-test-lib-${VERSION}-javadoc.jar \
            async-test-agent/target/async-test-agent-${VERSION}.jar \
            async-test-agent/target/async-test-agent-${VERSION}-sources.jar \
            async-test-agent/target/async-test-agent-${VERSION}-javadoc.jar \
            async-test-analysis/target/async-test-analysis-${VERSION}.jar \
            async-test-analysis/target/async-test-analysis-${VERSION}-sources.jar \
            async-test-analysis/target/async-test-analysis-${VERSION}-javadoc.jar \
            target/bom.xml \
            target/bom.json; do
            for candidate in "$f" "$f.asc" "$f.sigstore.json"; do
              if [ -f "$candidate" ]; then files+=("$candidate"); fi
            done
          done
          gh release create "${{ github.ref_name }}" \
            "${files[@]}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "## Async Test Library ${{ github.ref_name }}

          See [CHANGELOG.md](https://github.com/PIsberg/async-test-lib/blob/main/docs/CHANGELOG.md) for what's new.

          ### Maven
          \`\`\`xml
          <dependency>
            <groupId>se.deversity.async-test-lib</groupId>
            <artifactId>async-test-lib</artifactId>
            <version>${VERSION}</version>
            <scope>test</scope>
          </dependency>
          \`\`\`

          ### Gradle
          \`\`\`kotlin
          testImplementation(\"se.deversity.async-test-lib:async-test-lib:${VERSION}\")
          \`\`\`

          ### Verify a cosign signature
          All attached jars (async-test-lib, async-test-agent, async-test-analysis) and the
          CycloneDX SBOM (\`bom.xml\`) carry matching \`.sigstore.json\` bundles. Verify any
          file by substituting its name:
          \`\`\`bash
          cosign verify-blob --bundle async-test-lib-${VERSION}.jar.sigstore.json \\
            --certificate-identity-regexp 'https://github.com/PIsberg/async-test-lib' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            async-test-lib-${VERSION}.jar
          \`\`\`

          ### Verify the GPG signature
          \`\`\`bash
          gpg --verify async-test-lib-${VERSION}.jar.asc async-test-lib-${VERSION}.jar
          \`\`\`"
