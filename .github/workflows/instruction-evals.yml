# Instruction evals: the measurement lane for the instruction layer. When a PR edits the files
# agents obey (CLAUDE.md, AGENTS.md, GEMINI.md, .claude/**, the module files), this runs the
# task bank in evals/ and reports each rule's pass rate against its floor. evals/README.md
# documents the method and its limits.
#
# Engine: the GitHub Copilot CLI on the maintainer's Copilot Free quota, authenticated with
# the COPILOT_GITHUB_TOKEN repository secret (a personal token of an account that has
# Copilot). No Anthropic key is used or required. Without the secret, or when the quota is
# exhausted mid-run, the lane reports SKIPPED / HARNESS-ERROR trials, which are not passes.
#
# Advisory by decision (2026-08-15): a below-floor result is a warning annotation and a
# summary table, never a red job. The bank measures whether the prose binds; the rules it
# measures each have an enforcing gate behind them (locked-files, guardrail-drift,
# BuildMetadataSyncTest, the interceptor contract test), and those are what block.
#
# Cost: a default run is 12 headless Copilot sessions (4 tasks x 3 trials), so this triggers
# on the instruction-file paths and manual dispatch, never on every commit.

name: Instruction Evals

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - '.claude/**'
      - '.gemini/**'
      - 'async-test-*/CLAUDE.md'
      - 'async-test-*/.claude/**'
      - 'evals/**'
      - '.github/workflows/instruction-evals.yml'
  workflow_dispatch:
    inputs:
      trials:
        description: 'Trials per task (10 for decision-grade runs)'
        required: false
        default: '3'
      variant:
        description: 'full (repo as committed) or baseline (instruction files removed)'
        required: false
        default: 'full'

permissions:
  contents: read

concurrency:
  group: instruction-evals-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  evals:
    name: Instruction Evals (Copilot)
    runs-on: ubuntu-latest
    env:
      HAVE_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
    steps:
      # Sandboxed like every agent lane: ephemeral runner, one single-purpose secret, egress
      # BLOCKED except GitHub, the Copilot API and npm for the CLI install. Extend the list
      # in a reviewed commit if a legitimate endpoint gets blocked; never flip back to audit.
      - name: Harden the runner (Block egress, allowlist only)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.githubcopilot.com:443
            api.individual.githubcopilot.com:443
            api.business.githubcopilot.com:443
            api.enterprise.githubcopilot.com:443
            copilot-proxy.githubusercontent.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443

      - name: Note when the token is absent
        if: env.HAVE_TOKEN != 'true'
        run: |
          echo "SKIPPED: COPILOT_GITHUB_TOKEN secret is not configured; the instruction evals did not run. Skipped is not passed." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Instruction evals skipped: COPILOT_GITHUB_TOKEN secret is not configured. Skipped is not passed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAVE_TOKEN == 'true'

      - name: Install the Copilot CLI
        if: env.HAVE_TOKEN == 'true'
        run: npm install -g @github/copilot

      - name: Run the task bank (advisory)
        if: env.HAVE_TOKEN == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ENGINE: copilot
          TRIALS: ${{ github.event.inputs.trials || '3' }}
          VARIANT: ${{ github.event.inputs.variant || 'full' }}
          RESULTS_DIR: ${{ github.workspace }}/eval-results
        run: |
          bash evals/run-instruction-evals.sh && status=0 || status=$?
          echo "## Instruction evals (Copilot, ${VARIANT}, ${TRIALS} trials/task)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULTS_DIR/summary.csv" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$RESULTS_DIR/summary.csv" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$status" in
            0) echo "All tasks met their floors." ;;
            1) echo "::warning::Instruction evals: at least one rule is below its floor. Advisory: read the summary, then rewrite, promote or delete the rule (evals/README.md)." ;;
            *) echo "SKIPPED: the harness could not run (exit $status: missing CLI, exhausted quota, or auth). Skipped is not passed." >> "$GITHUB_STEP_SUMMARY"
               echo "::notice::Instruction evals skipped: harness exit $status." ;;
          esac
          exit 0

      - name: Upload trial logs
        if: env.HAVE_TOKEN == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instruction-eval-results
          path: eval-results/
          if-no-files-found: ignore
