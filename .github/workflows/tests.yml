name: Tests & Build

# The library's own build: unit tests, coverage, packaging and Javadoc.
#
# Everything that consumes the *built artifact* — the consumer fixture and the examples
# reactor — lives in e2e-tests.yml. Keeping them apart means a broken example cannot mask
# a library regression, and the e2e suite installs the artifact itself instead of riding
# on this workflow's local repository.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * *'
  # So an OS-sensitive branch can still get all nine legs before it merges: a
  # dispatch is not a pull request, and the matrix below keys on that (#484).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    # ubuntu-latest is the required leg (unchanged behavior); windows-latest and
    # macos-latest are experimental legs that must not block the required leg.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25', '26' ]
        # Three operating systems on a push or a schedule, ubuntu alone on a pull
        # request. The windows and macos legs are continue-on-error above, which means
        # they have never been able to fail a PR: they were six jobs of about 18
        # minutes each that no one could act on before merging, and the build job below
        # waited for all nine before it could start. They still run on every push to
        # main and on the nightly schedule, which is where an OS-specific break is
        # caught - within the hour, against a green main rather than a PR diff (#484).
        os: >-
          ${{ github.event_name == 'pull_request'
              && fromJson('["ubuntu-latest"]')
              || fromJson('["ubuntu-latest","windows-latest","macos-latest"]') }}

    # Slow/shared CI runners (e.g. 3-core macOS/windows-latest runners) can turn ~121
    # detectors' setup overhead in ConcurrencyRunner.execute into a meaningful fraction of a
    # short @AsyncTest timeoutMs budget, producing timeouts that reflect runner speed rather
    # than a real concurrency bug (see ConcurrencyRunner.resolveTimeoutMultiplier). Scale via
    # this env var, not a `-D` system property passed to `mvn`: Surefire forks a separate JVM
    # per test run, and only environment variables — not system properties given to the
    # outer `mvn` process — propagate into that forked JVM automatically.
    #
    # The consumer-fixture and examples suites moved to e2e-tests.yml; this job is the
    # library's own test run, packaging and coverage upload.
    env:
      ASYNC_TEST_TIMEOUT_MULTIPLIER: ${{ matrix.os == 'ubuntu-latest' && '1' || '3' }}
      # The one leg whose coverage anyone reads. Every other leg skips JaCoCo, which roughly
      # doubles serial test time, and with it the coverage steps below (#899). The jacoco-check
      # gate still runs here, so coverage stays enforced once per run.
      UPLOADS_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.java-version == '21' }}

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          # Only the JDKs the runner image already caches are free. 26 is not cached, so
          # setup-java downloads it from a GitHub release asset, and without this host the
          # step fails before a single test runs.
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            cli.codecov.io:443
            codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keys.openpgp.org:443
            keyserver.ubuntu.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            uploader.codecov.io:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Java
        id: setup-java
        # JDK 26 is on no runner image yet, so this leg resolves and downloads it from
        # api.adoptium.net on every run, while 21 and 25 come from the image cache. The action
        # has no retry of its own, so one DNS blip fails the job before a line of code runs:
        # "Error: Java setup process failed due to: getaddrinfo EAI_AGAIN api.adoptium.net",
        # seen on 2026-08-25 in a leg that had passed on the previous commit and in 21 of the
        # 22 preceding JDK 26 job runs. continue-on-error hands that case to the retry below.
        # A genuine outage or a wrong version still fails the job, because the retry does not
        # carry continue-on-error.
        continue-on-error: true
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Set up Java (retry after a transient resolver failure)
        if: steps.setup-java.outcome == 'failure'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Run library tests and install artifact
        # Two per-class JVMs at a time on Ubuntu (#898): every class still gets its own JVM, so
        # nothing is shared, and the soak recorded in the pom comment ran on Ubuntu.
        # The skip is quoted: Windows runs this step in PowerShell, which splits a bare
        # -Djacoco.skip=true at the dot and hands Maven ".skip=true" as a phase (#899).
        run: mvn clean install ${{ env.UPLOADS_COVERAGE != 'true' && '"-Djacoco.skip=true"' || '' }} ${{ matrix.os == 'ubuntu-latest' && '-Dsurefire.forkCount=2' || '' }}

      - name: Check skipped tests against the baseline
        # A skip is a pass to the build tool; this fails on one .github/skipped-tests.txt does not list, or a listed one that ran (#905).
        # The self-test first: a parser that quietly stopped recognising a skip would pass empty.
        # The context names the OS, so the baseline can say a test skips on two and runs on the
        # third (#950).
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" .github/scripts/skipped_tests_gate.py . --self-test
          "$py" .github/scripts/skipped_tests_gate.py . "tests/jdk${{ matrix.java-version }}/${{ matrix.os }}" .

      - name: Check coverage file exists
        if: env.UPLOADS_COVERAGE == 'true'
        shell: bash
        run: |
          if [ -f ./async-test-lib/target/site/jacoco/jacoco.xml ]; then
            echo "✓ Coverage file found"
            wc -c ./async-test-lib/target/site/jacoco/jacoco.xml
          else
            echo "✗ Coverage file NOT found at ./async-test-lib/target/site/jacoco/jacoco.xml"
            echo "Checking target directory structure:"
            ls -la ./async-test-lib/target/ || echo "target/ directory not found"
            ls -la ./async-test-lib/target/site/ || echo "target/site/ directory not found"
            ls -la ./async-test-lib/target/site/jacoco/ || echo "target/site/jacoco/ directory not found"
            exit 1
          fi

      - name: Import Codecov GPG key
        if: env.UPLOADS_COVERAGE == 'true'
        shell: bash
        run: |
          gpg --keyserver hkps://keys.openpgp.org --recv-keys 27034E7FDB850E0BBC2C62FF806BB28AED779869 || \
          gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 27034E7FDB850E0BBC2C62FF806BB28AED779869 || \
          echo "WARNING: Could not import GPG key, proceeding without verification"

      - name: Upload coverage to Codecov
        if: env.UPLOADS_COVERAGE == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./async-test-lib/target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  os-sensitive:
    name: OS-Sensitive Tests
    # The Test Suite legs on windows and macos are continue-on-error and skip pull requests
    # (#484), so a defect only those platforms produce could fail no check at all:
    # LicenseValidationCacheDogfoodTest guards one (#904), a temp-file leak Linux cannot
    # reproduce. This job runs only the @OsSensitive classes, on every event and without
    # continue-on-error, so it costs minutes instead of the full suite's 18 and a red result
    # here is a real failure (#907). OsSensitiveTestsBlockOnEveryOsTest pins its shape.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    env:
      # Same scaling as the Test Suite legs on these runners; see the comment there.
      ASYNC_TEST_TIMEOUT_MULTIPLIER: '3'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run the OS-sensitive tests
        # Quoted for PowerShell, which runs this step on Windows (#899).
        run: mvn -pl async-test-lib test "-Dgroups=os-sensitive" "-Djacoco.skip=true"

      - name: Check skipped tests against the baseline
        # A skip is a pass to the build tool; this fails on one .github/skipped-tests.txt does not list, or a listed one that ran (#905).
        shell: bash
        run: $(command -v python3 || command -v python) .github/scripts/skipped_tests_gate.py . "os-sensitive/${{ matrix.os }}" async-test-lib

      - name: Fail if the tag selected nothing
        # -Dgroups matching no class runs zero tests and passes. A lost tag must not read
        # as a green platform.
        shell: bash
        run: |
          count=$(find async-test-lib/target/surefire-reports -name 'TEST-*.xml' 2>/dev/null | wc -l)
          echo "surefire reports: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::-Dgroups=os-sensitive ran no test class"
            exit 1
          fi

  build:
    name: Build Maven Project
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25', '26' ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          # 26 is not cached in the runner image, so setup-java fetches it from a GitHub
          # release asset; without this host the step fails before anything is built.
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        id: setup-java
        # JDK 26 is on no runner image yet, so this leg resolves and downloads it from
        # api.adoptium.net on every run, while 21 and 25 come from the image cache. The action
        # has no retry of its own, so one DNS blip fails the job before a line of code runs:
        # "Error: Java setup process failed due to: getaddrinfo EAI_AGAIN api.adoptium.net",
        # seen on 2026-08-25 in a leg that had passed on the previous commit and in 21 of the
        # 22 preceding JDK 26 job runs. continue-on-error hands that case to the retry below.
        # A genuine outage or a wrong version still fails the job, because the retry does not
        # carry continue-on-error.
        continue-on-error: true
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Set up Java (retry after a transient resolver failure)
        if: steps.setup-java.outcome == 'failure'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Compile and build
        run: mvn clean package -DskipTests
      
      - name: Display build output
        run: ls -lah */target/
      
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: async-test-library-java-${{ matrix.java-version }}
          path: "*/target/async-test-*.jar"
          retention-days: 30
      
      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports-java-${{ matrix.java-version }}
          path: "*/target/surefire-reports/"
          retention-days: 7

  publish-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [ test, build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        java-version: [ '21' ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Generate Javadoc
        # `javadoc:javadoc` alone is a bare goal: it does not build the sibling modules, so
        # async-test-agent tries to resolve async-test-lib from Central. That silently
        # documented the PREVIOUSLY PUBLISHED library on every run, and fails outright on a
        # release commit whose version is not on Central yet. `package` first builds the
        # reactor so the goal reads this repo.
        run: mvn -DskipTests package javadoc:javadoc
      
      - name: Display documentation output
        run: ls -lah async-test-lib/target/reports/apidocs/
      
      - name: Upload Javadoc artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javadoc-java-${{ matrix.java-version }}
          path: async-test-lib/target/reports/apidocs/
          retention-days: 30

