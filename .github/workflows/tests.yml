name: Tests & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25' ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            cli.codecov.io:443
            codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keys.openpgp.org:443
            keyserver.ubuntu.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            storage.googleapis.com:443
            uploader.codecov.io:443

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Prepare local Maven repository
        run: mkdir -p .m2/repository
      
      - name: Run library tests and install artifact
        run: mvn -Dmaven.repo.local=.m2/repository clean install

      - name: Run consumer fixture tests
        run: mvn -Dmaven.repo.local=.m2/repository -f consumer-fixture/pom.xml test

      - name: Check coverage file exists
        run: |
          if [ -f ./target/site/jacoco/jacoco.xml ]; then
            echo "✓ Coverage file found"
            wc -c ./target/site/jacoco/jacoco.xml
          else
            echo "✗ Coverage file NOT found at ./target/site/jacoco/jacoco.xml"
            echo "Checking target directory structure:"
            ls -la ./target/ || echo "target/ directory not found"
            ls -la ./target/site/ || echo "target/site/ directory not found"
            ls -la ./target/site/jacoco/ || echo "target/site/jacoco/ directory not found"
            exit 1
          fi

      - name: Import Codecov GPG key
        run: |
          gpg --keyserver hkps://keys.openpgp.org --recv-keys 27034E7FDB850E0BBC2C62FF806BB28AED779869 || \
          gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 27034E7FDB850E0BBC2C62FF806BB28AED779869 || \
          echo "WARNING: Could not import GPG key, proceeding without verification"

      - name: Upload coverage to Codecov
        if: matrix.java-version == '21'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  examples-pr-detect:
    name: Detect changed examples (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      modules: ${{ steps.compute.outputs.modules }}
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          list-files: shell
          filters: |
            examples:
              - 'examples/**'

      - name: Compute changed example modules
        id: compute
        run: |
          if [ "${{ steps.filter.outputs.examples }}" != "true" ]; then
            echo "modules=" >> "$GITHUB_OUTPUT"
            echo "No examples touched."
            exit 0
          fi
          modules=$(printf '%s\n' ${{ steps.filter.outputs.examples_files }} \
            | awk -F/ 'NF>=3 && $1=="examples" {print $2}' \
            | while read m; do [ -f "examples/$m/pom.xml" ] && echo "$m"; done \
            | sort -u \
            | paste -sd ',' -)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Changed example modules: $modules"

  examples-pr:
    name: Examples Shard ${{ matrix.shard }} (PR)
    runs-on: ubuntu-latest
    needs: examples-pr-detect
    if: github.event_name == 'pull_request' && needs.examples-pr-detect.outputs.modules != ''

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21' ]
        shard: [ 0, 1, 2, 3 ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Install library to local Maven repository
        run: mvn -Dmaven.repo.local=.m2/repository -DskipTests clean install

      - name: Run shard's slice of changed examples
        run: |
          set -euo pipefail
          TOTAL=4
          SHARD=${{ matrix.shard }}
          slice=$(echo "${{ needs.examples-pr-detect.outputs.modules }}" \
            | tr ',' '\n' \
            | awk -v s="$SHARD" -v n="$TOTAL" 'NR%n==s' \
            | paste -sd ',' -)
          if [ -z "$slice" ]; then
            echo "Shard $SHARD has no modules in the changed set"
            exit 0
          fi
          echo "Shard $SHARD modules: $slice"
          mvn -Dmaven.repo.local=.m2/repository -f examples/pom.xml -pl "$slice" test -T 1C -fae

      - name: Upload shard test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: example-pr-reports-shard-${{ matrix.shard }}
          path: examples/*/target/surefire-reports/
          retention-days: 7

  examples-full:
    name: Examples Reactor (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'schedule'

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21' ]
        shard: [ 0, 1, 2, 3 ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Install library to local Maven repository
        run: mvn -Dmaven.repo.local=.m2/repository -DskipTests clean install

      - name: Run example reactor shard
        run: |
          set -euo pipefail
          TOTAL=4
          SHARD=${{ matrix.shard }}
          modules=$(ls -1 examples/*/pom.xml \
            | awk -F/ '{print $2}' \
            | sort \
            | awk -v s="$SHARD" -v n="$TOTAL" 'NR%n==s' \
            | paste -sd ',' -)
          if [ -z "$modules" ]; then
            echo "Shard $SHARD has no modules"; exit 0
          fi
          echo "Shard $SHARD modules: $modules"
          mvn -Dmaven.repo.local=.m2/repository -f examples/pom.xml -pl "$modules" test -T 1C -fae

      - name: Upload shard test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: example-reactor-reports-shard-${{ matrix.shard }}
          path: examples/*/target/surefire-reports/
          retention-days: 7

  build:
    name: Build Maven Project
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25' ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Compile and build
        run: mvn clean package -DskipTests
      
      - name: Display build output
        run: ls -lah target/
      
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: async-test-library-java-${{ matrix.java-version }}
          path: target/async-test-*.jar
          retention-days: 30
      
      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports-java-${{ matrix.java-version }}
          path: target/surefire-reports/
          retention-days: 7

  publish-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [ test, build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        java-version: [ '21' ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Generate Javadoc
        run: mvn -DskipTests javadoc:javadoc
      
      - name: Display documentation output
        run: ls -lah target/reports/apidocs/
      
      - name: Upload Javadoc artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javadoc-java-${{ matrix.java-version }}
          path: target/reports/apidocs/
          retention-days: 30

