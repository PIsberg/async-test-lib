# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on:
  pull_request:
    # Prose and pictures cannot change what this workflow reviews. Kept narrow on purpose:
    # no source, build file or workflow path is listed. The workflows carrying a required
    # status context are deliberately not filtered - a required check that never reports
    # leaves the pull request permanently BLOCKED, which is worse than the fan-out (#484).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

concurrency:
  # One run per workflow per ref. cancel-in-progress only for pull requests: a superseded
  # push has nothing to say, while a run on main or a schedule is the record of that commit
  # and must finish. Without this a force-push left the previous run alive and both competed
  # for the same runners (#484).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            api.oss.dev:443
            github.com:443
            objects.githubusercontent.com:443
            api.securityscorecards.dev:443

      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0
          comment-summary-in-pr: always
