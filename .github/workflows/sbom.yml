name: SBOM Generation

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - '**/pom.xml'
  pull_request:
    branches: [main]
    paths:
      - 'pom.xml'
      - '**/pom.xml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            uploads.github.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate SBOM with CycloneDX
        # skipNotDeployed=false is required because cyclonedx-maven-plugin 2.9+
        # otherwise skips the goal whenever maven.deploy.skip is effectively true
        # (which is the case for this single-module library), leaving no
        # target/bom.xml for the release-upload step.
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -Dcyclonedx.skipNotDeployed=false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            target/bom.xml
            target/bom.json
          retention-days: 30

      - name: Upload SBOM to Release
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'release'
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: target/bom.xml
          asset_name: bom.xml
          asset_content_type: application/xml
