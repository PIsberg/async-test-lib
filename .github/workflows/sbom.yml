name: SBOM Generation

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - '**/pom.xml'
  pull_request:
    branches: [main]
    paths:
      - 'pom.xml'
      - '**/pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            uploads.github.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate SBOM with CycloneDX
        # skipNotDeployed=false is required because cyclonedx-maven-plugin 2.9+
        # otherwise skips the goal whenever maven.deploy.skip is effectively true,
        # leaving no target/bom.xml for the artifact upload below. The bom attached
        # to GitHub releases is produced and cosign-signed by publish.yml at tag time.
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -Dcyclonedx.skipNotDeployed=false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            target/bom.xml
            target/bom.json
          retention-days: 30
