name: Gradle Tests & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle-test:
    name: Gradle Test Suite
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Gradle 8.13 requires Java 21 or earlier as the daemon JVM.
        # Java 25 compatibility is already covered by the Maven workflow.
        java-version: [ '21' ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            downloads.gradle-dn.com:443
            github.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Uses the version declared in gradle/wrapper/gradle-wrapper.properties
          # gradle-wrapper.jar is generated locally via: gradle wrapper --gradle-version 8.13
          gradle-version: wrapper

      - name: Run library tests and generate coverage report
        run: ./gradlew test jacocoTestReport

      - name: Publish library to local Maven repository
        run: ./gradlew publishToMavenLocal

      - name: Run consumer fixture tests
        run: ./gradlew -p consumer-fixture test

      - name: Check coverage file exists
        run: |
          if [ -f ./async-test-lib/build/reports/jacoco/test/jacocoTestReport.xml ]; then
            echo "✓ Coverage file found"
            wc -c ./async-test-lib/build/reports/jacoco/test/jacocoTestReport.xml
          else
            echo "✗ Coverage file NOT found at ./async-test-lib/build/reports/jacoco/test/jacocoTestReport.xml"
            echo "Checking build directory structure:"
            ls -la ./async-test-lib/build/ || echo "build/ directory not found"
            ls -la ./async-test-lib/build/reports/ || echo "build/reports/ directory not found"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gradle-test-reports-java-${{ matrix.java-version }}
          path: "*/build/reports/tests/"
          retention-days: 7

  gradle-examples-pr-detect:
    name: Detect changed Gradle examples (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      modules: ${{ steps.compute.outputs.modules }}
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          list-files: shell
          filters: |
            examples:
              - 'examples/**'

      - name: Compute changed example modules
        id: compute
        run: |
          if [ "${{ steps.filter.outputs.examples }}" != "true" ]; then
            echo "modules=" >> "$GITHUB_OUTPUT"
            echo "No examples touched."
            exit 0
          fi
          modules=$(printf '%s\n' ${{ steps.filter.outputs.examples_files }} \
            | awk -F/ 'NF>=3 && $1=="examples" {print $2}' \
            | while read m; do [ -f "examples/$m/build.gradle.kts" ] && echo "$m"; done \
            | sort -u \
            | paste -sd ',' -)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Changed Gradle example modules: $modules"

  gradle-examples-pr:
    name: Gradle Examples Shard ${{ matrix.shard }} (PR)
    runs-on: ubuntu-latest
    needs: gradle-examples-pr-detect
    if: github.event_name == 'pull_request' && needs.gradle-examples-pr-detect.outputs.modules != ''

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21' ]
        shard: [ 0, 1, 2, 3 ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            downloads.gradle-dn.com:443
            github.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Publish library to local Maven repository
        run: ./gradlew publishToMavenLocal -x test

      - name: Run shard's slice of changed examples
        run: |
          set -euo pipefail
          TOTAL=4
          SHARD=${{ matrix.shard }}
          tasks=$(echo "${{ needs.gradle-examples-pr-detect.outputs.modules }}" \
            | tr ',' '\n' \
            | awk -v s="$SHARD" -v n="$TOTAL" 'NR%n==s' \
            | awk '{printf ":%s:test ", $0}')
          if [ -z "$tasks" ]; then
            echo "Shard $SHARD has no modules in the changed set"
            exit 0
          fi
          echo "Shard $SHARD tasks: $tasks"
          ./gradlew -p examples $tasks --parallel --continue

      - name: Upload shard test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gradle-example-pr-reports-shard-${{ matrix.shard }}
          path: examples/*/build/reports/tests/
          retention-days: 7

  gradle-examples-full:
    name: Gradle Examples Reactor (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: gradle-test
    if: github.event_name == 'push' || github.event_name == 'schedule'

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21' ]
        shard: [ 0, 1, 2, 3 ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            downloads.gradle-dn.com:443
            github.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Publish library to local Maven repository
        run: ./gradlew publishToMavenLocal -x test

      - name: Run example reactor shard
        run: |
          set -euo pipefail
          TOTAL=4
          SHARD=${{ matrix.shard }}
          tasks=$(ls -1 examples/*/build.gradle.kts \
            | awk -F/ '{print $2}' \
            | sort \
            | awk -v s="$SHARD" -v n="$TOTAL" 'NR%n==s' \
            | awk '{printf ":%s:test ", $0}')
          if [ -z "$tasks" ]; then
            echo "Shard $SHARD has no Gradle modules"; exit 0
          fi
          echo "Shard $SHARD tasks: $tasks"
          ./gradlew -p examples $tasks --parallel --continue

      - name: Upload shard test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gradle-example-reactor-reports-shard-${{ matrix.shard }}
          path: examples/*/build/reports/tests/
          retention-days: 7

  gradle-build:
    name: Build Gradle Project
    runs-on: ubuntu-latest
    needs: gradle-test

    strategy:
      fail-fast: false
      matrix:
        # Gradle 8.13 requires Java 21 or earlier as the daemon JVM.
        # Java 25 compatibility is already covered by the Maven workflow.
        java-version: [ '21' ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            downloads.gradle-dn.com:443
            github.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Compile and assemble artifacts
        run: ./gradlew assemble -x test

      - name: Display build output
        run: ls -lah */build/libs/

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: async-test-library-gradle-java-${{ matrix.java-version }}
          path: "*/build/libs/async-test-*.jar"
          retention-days: 30
