name: Gradle Tests & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle-test:
    name: Gradle Test Suite
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Gradle 8.13 requires Java 21 or earlier as the daemon JVM.
        # Java 25 compatibility is already covered by the Maven workflow.
        java-version: [ '21' ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            downloads.gradle-dn.com:443
            github.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Uses the version declared in gradle/wrapper/gradle-wrapper.properties
          # gradle-wrapper.jar is generated locally via: gradle wrapper --gradle-version 8.13
          gradle-version: wrapper

      - name: Run library tests and generate coverage report
        run: ./gradlew test jacocoTestReport

      - name: Publish library to local Maven repository
        run: ./gradlew publishToMavenLocal

      - name: Run consumer fixture tests
        run: ./gradlew -p consumer-fixture test

      - name: Check coverage file exists
        run: |
          if [ -f ./async-test-lib/build/reports/jacoco/test/jacocoTestReport.xml ]; then
            echo "✓ Coverage file found"
            wc -c ./async-test-lib/build/reports/jacoco/test/jacocoTestReport.xml
          else
            echo "✗ Coverage file NOT found at ./async-test-lib/build/reports/jacoco/test/jacocoTestReport.xml"
            echo "Checking build directory structure:"
            ls -la ./async-test-lib/build/ || echo "build/ directory not found"
            ls -la ./async-test-lib/build/reports/ || echo "build/reports/ directory not found"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gradle-test-reports-java-${{ matrix.java-version }}
          path: "*/build/reports/tests/"
          retention-days: 7

  gradle-examples-pr-detect:
    name: Detect changed Gradle examples (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      modules: ${{ steps.compute.outputs.modules }}
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          list-files: shell
          filters: |
            examples:
              - 'examples/**'
            # A library change touches no examples/** path, yet every example consumes the
            # built artifact and can break because of it. Treated below as a reason to run a
            # sample rather than nothing.
            library:
              - 'async-test-lib/src/main/**'
              - 'async-test-agent/src/main/**'
              - 'async-test-analysis/src/main/**'
              - 'pom.xml'
              - 'build.gradle.kts'
            # The pipeline that runs the examples is itself a reason to run some. Without this,
            # a change to the sharding or to the filter above ships without building a single
            # example, and a change to this file cannot demonstrate its own effect.
            pipeline:
              - '.github/workflows/gradle-tests.yml'

      - name: Compute changed example modules
        id: compute
        run: |
          set -uo pipefail

          # 1. Examples this PR edited directly.
          changed=""
          if [ "${{ steps.filter.outputs.examples }}" = "true" ]; then
            changed=$(printf '%s\n' ${{ steps.filter.outputs.examples_files }} \
              | awk -F/ 'NF>=3 && $1=="examples" {print $2}' \
              | while read m; do [ -f "examples/$m/build.gradle.kts" ] && echo "$m"; done)
          fi

          # 2. A library change edits no examples/** path, but every example consumes the built
          #    artifact, so one can break all of them while this filter sees nothing. Run a
          #    deterministic every-4th sample (~32 of 127): enough to catch a systemic break at
          #    PR time, cheap enough to afford on every library PR. The full reactor still runs
          #    on push and nightly, so this moves discovery earlier rather than adding coverage.
          sample=""
          if [ "${{ steps.filter.outputs.library }}" = "true" ] \
             || [ "${{ steps.filter.outputs.pipeline }}" = "true" ]; then
            sample=$(ls -1 examples/*/build.gradle.kts | awk -F/ '{print $2}' | sort | awk 'NR%4==1')
            echo "Library sources or this pipeline changed - sampling every 4th Gradle example project."
          fi

          modules=$(printf '%s\n%s\n' "$changed" "$sample" \
            | grep -v '^$' \
            | sort -u \
            | paste -sd ',' - || true)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          if [ -z "$modules" ]; then
            echo "No Gradle example projects to run."
          else
            echo "Gradle example modules to run: $modules"
          fi

  gradle-examples-pr:
    name: Gradle Examples Shard ${{ matrix.shard }} (PR)
    runs-on: ubuntu-latest
    needs: gradle-examples-pr-detect
    if: github.event_name == 'pull_request' && needs.gradle-examples-pr-detect.outputs.modules != ''

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21' ]
        shard: [ 0, 1, 2, 3 ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            downloads.gradle-dn.com:443
            github.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Publish library to local Maven repository
        run: ./gradlew publishToMavenLocal -x test

      - name: Run shard's slice of changed examples
        run: |
          set -euo pipefail
          TOTAL=4
          SHARD=${{ matrix.shard }}
          tasks=$(echo "${{ needs.gradle-examples-pr-detect.outputs.modules }}" \
            | tr ',' '\n' \
            | awk -v s="$SHARD" -v n="$TOTAL" 'NR%n==s' \
            | awk '{printf ":%s:test ", $0}')
          if [ -z "$tasks" ]; then
            echo "Shard $SHARD has no modules in the changed set"
            exit 0
          fi
          echo "Shard $SHARD tasks: $tasks"
          ./gradlew -p examples $tasks --parallel --continue

      - name: Upload shard test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gradle-example-pr-reports-shard-${{ matrix.shard }}
          path: examples/*/build/reports/tests/
          retention-days: 7

  gradle-examples-full:
    name: Gradle Examples Reactor (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: gradle-test
    if: github.event_name == 'push' || github.event_name == 'schedule'

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21' ]
        shard: [ 0, 1, 2, 3 ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            downloads.gradle-dn.com:443
            github.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Publish library to local Maven repository
        run: ./gradlew publishToMavenLocal -x test

      - name: Run example reactor shard
        run: |
          set -euo pipefail
          TOTAL=4
          SHARD=${{ matrix.shard }}
          tasks=$(ls -1 examples/*/build.gradle.kts \
            | awk -F/ '{print $2}' \
            | sort \
            | awk -v s="$SHARD" -v n="$TOTAL" 'NR%n==s' \
            | awk '{printf ":%s:test ", $0}')
          if [ -z "$tasks" ]; then
            echo "Shard $SHARD has no Gradle modules"; exit 0
          fi
          echo "Shard $SHARD tasks: $tasks"
          ./gradlew -p examples $tasks --parallel --continue

      - name: Upload shard test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gradle-example-reactor-reports-shard-${{ matrix.shard }}
          path: examples/*/build/reports/tests/
          retention-days: 7

  gradle-build:
    name: Build Gradle Project
    runs-on: ubuntu-latest
    needs: gradle-test

    strategy:
      fail-fast: false
      matrix:
        # Gradle 8.13 requires Java 21 or earlier as the daemon JVM.
        # Java 25 compatibility is already covered by the Maven workflow.
        java-version: [ '21' ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            downloads.gradle-dn.com:443
            github.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Compile and assemble artifacts
        run: ./gradlew assemble -x test

      - name: Display build output
        run: ls -lah */build/libs/

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: async-test-library-gradle-java-${{ matrix.java-version }}
          path: "*/build/libs/async-test-*.jar"
          retention-days: 30
