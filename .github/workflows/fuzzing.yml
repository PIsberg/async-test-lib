name: Fuzzing

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jazzer:
    name: Jazzer fuzz targets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            github-releases.githubusercontent.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile test classes
        run: mvn -DskipTests test-compile

      - name: Download Jazzer CLI
        run: |
          curl -fsSL -o jazzer_linux.tar.gz \
            https://github.com/CodeIntelligenceTesting/jazzer/releases/download/v0.22.1/jazzer-linux.tar.gz
          tar -xzf jazzer_linux.tar.gz jazzer
          chmod +x jazzer

      - name: Fuzz AsyncTestConfig builder
        run: |
          ./jazzer \
            --target_class=se.deversity.asynctest.fuzz.AsyncTestConfigFuzzTarget \
            --cp=async-test-lib/target/test-classes:async-test-lib/target/classes \
            -max_total_time=120 \
            -print_final_stats=1 \
            -artifact_prefix=fuzzing-findings/
        continue-on-error: true  # findings are artifacts, not hard failures in CI

      - name: Upload fuzzing findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jazzer-findings
          path: fuzzing-findings/
          if-no-files-found: ignore
          retention-days: 30
