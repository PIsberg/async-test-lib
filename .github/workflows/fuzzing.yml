name: Fuzzing

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jazzer:
    name: Jazzer fuzz targets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            github-releases.githubusercontent.com:443
            objects.githubusercontent.com:443
            # GitHub serves release assets from release-assets.githubusercontent.com. Without
            # it the Jazzer CLI download dies on "curl: (7) Failed to connect", the fuzz step
            # is skipped, and the job fails. Every scheduled run from at least 2026-06-29 to
            # 2026-08-10 died here, so nothing was fuzzed in that window.
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile test classes
        run: mvn -DskipTests test-compile

      - name: Download Jazzer CLI
        run: |
          curl -fsSL -o jazzer_linux.tar.gz \
            https://github.com/CodeIntelligenceTesting/jazzer/releases/download/v0.22.1/jazzer-linux.tar.gz
          # Extract the whole archive, not just the launcher. The `jazzer` binary is a thin
          # driver that loads jazzer_standalone.jar from its own directory; pulling out only
          # the binary made every run die with "Could not find jazzer_standalone.jar".
          tar -xzf jazzer_linux.tar.gz
          chmod +x jazzer
          test -f jazzer_standalone.jar

      - name: Fuzz AsyncTestConfig builder
        run: |
          # A finding is an artifact, not a build failure, so Jazzer's own exit code is
          # tolerated. Jazzer failing to *start* is a different thing and must be loud: this
          # step reported success for months while fuzzing nothing, first because the egress
          # allowlist blocked the download and then because the archive was half-extracted.
          # libFuzzer prints "#<n> INITED" only once the target class has loaded and the
          # initial corpus has executed, so that line is the evidence the harness really ran.
          set -o pipefail
          # -artifact_prefix only accepts a directory that already exists; libFuzzer refuses
          # to create it and aborts before INITED with "The required directory ... does not
          # exist". This was the third failure hiding behind continue-on-error.
          mkdir -p fuzzing-findings
          ./jazzer \
            --target_class=se.deversity.asynctest.fuzz.AsyncTestConfigFuzzTarget \
            --cp=async-test-lib/target/test-classes:async-test-lib/target/classes \
            -max_total_time=120 \
            -print_final_stats=1 \
            -artifact_prefix=fuzzing-findings/ 2>&1 | tee jazzer.log || true
          if ! grep -qE "INITED|stat::number_of_executed_units" jazzer.log; then
            echo "::error::Jazzer never reached INITED — the harness did not run. This is a"
            echo "::error::toolchain or classpath failure, not a fuzzing finding."
            exit 1
          fi

      - name: Upload fuzzing findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jazzer-findings
          path: fuzzing-findings/
          if-no-files-found: ignore
          retention-days: 30
