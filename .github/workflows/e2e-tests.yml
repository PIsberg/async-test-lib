name: E2E Tests

# End-to-end coverage: everything that consumes the *built artifact* rather than the
# sources. Two suites, one workflow:
#
#   consumer-fixture/  — a downstream-style module that resolves async-test-lib from the
#                        local Maven repository and drives it through its public API only.
#                        Its detectors/ package holds one @AsyncTest fixture per DetectorType,
#                        so a green run proves every detector is selectable and reachable
#                        from consumer code.
#   consumer-fixture-langs/ — the same idea from Kotlin, Groovy, Scala and Clojure: one module
#                        per language, each asserting that RaceConditionDetector fires on an
#                        unguarded write and stays silent on a guarded one. Runs as a step of
#                        the consumer-fixture job so it shares the install and both JDKs.
#   examples/          — ~118 standalone Maven projects, each a runnable demonstration of one
#                        concurrency hazard, built the way a user would build them.
#
# Both need the library installed to a local repository first — that install step is what
# makes these end-to-end rather than unit tests. Library unit tests, packaging and Javadoc
# live in tests.yml; this workflow deliberately does not duplicate them.
#
# corpus-eval/ used to be a job here and now has its own workflow, corpus.yml. It measures the
# product rather than the build — whether a finding on somebody else's code means their code is
# wrong — and publishes numbers the README and the trust tiers rest on, so it earns its own history
# and its own required check. Its per-JDK legs kept their names, so nothing that referred to
# "Corpus Eval (Java 21)" had to change.

on:
  push:
    branches: [ main, develop ]
    # Prose and pictures cannot change what this workflow tests. Kept narrow on purpose:
    # no source, build file or workflow path is listed. The workflows carrying a required
    # status context are deliberately not filtered - a required check that never reports
    # leaves the pull request permanently BLOCKED, which is worse than the fan-out (#484).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]
    # Not path-filtered, unlike push: this workflow reports the required E2E Tests context, and
    # a pull request whose required context never reports is BLOCKED, not passing. A docs-only
    # pull request therefore runs the e2e suite; RequiredCheckIsNeverPathFilteredTest keeps a
    # filter from coming back here (#910).
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consumer-fixture:
    name: Consumer Fixture (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25', '26' ]

    # The fixture now runs one @AsyncTest round per detector, so its wall-clock is dominated
    # by ~127 short concurrent rounds rather than by any single test. Shared CI runners can
    # still stretch a round past a short timeoutMs budget; scale via this env var, not a `-D`
    # system property, because Surefire forks a separate JVM and only environment variables
    # propagate into it automatically. See ConcurrencyRunner.resolveTimeoutMultiplier.
    env:
      ASYNC_TEST_TIMEOUT_MULTIPLIER: '1'

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Only the JDKs the runner image already caches are free. 26 is not cached, so
          # setup-java downloads it from a GitHub release asset, and without this host the
          # step fails before the fixture runs at all.
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        id: setup-java
        # JDK 26 is on no runner image yet, so this leg resolves and downloads it from
        # api.adoptium.net on every run, while 21 and 25 come from the image cache. The action
        # has no retry of its own, so one DNS blip fails the job before a line of code runs:
        # "Error: Java setup process failed due to: getaddrinfo EAI_AGAIN api.adoptium.net",
        # seen on 2026-08-25 in a leg that had passed on the previous commit and in 21 of the
        # 22 preceding JDK 26 job runs. continue-on-error hands that case to the retry below.
        # A genuine outage or a wrong version still fails the job, because the retry does not
        # carry continue-on-error.
        continue-on-error: true
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Java (retry after a transient resolver failure)
        if: steps.setup-java.outcome == 'failure'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      # setup-java's cache: maven is one entry shared by every job, keyed on the pom hashes and
      # never saved again after a hit, so the four language fixtures' compilers came from Central on
      # every run (#890). The library itself is never cached: each run installs it from source, and
      # a cached build of the same version must not stand in for it.
      - name: Cache this job's Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/se/deversity
          key: maven-${{ runner.os }}-consumer-fixture-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-consumer-fixture-

      - name: Install library to local Maven repository
        run: mvn -DskipTests clean install

      - name: Run consumer fixture suite
        run: mvn -f consumer-fixture/pom.xml test

      # Kotlin, Groovy, Scala and Clojure against the same installed artifact. Not part of the
      # JUnit compatibility matrix below on purpose: four compilers times seven Jupiter versions
      # is the wrong trade, and the language question is independent of the Jupiter version.
      - name: Run JVM language fixtures (Kotlin, Groovy, Scala, Clojure)
        run: mvn -f consumer-fixture-langs/pom.xml test

      - name: Check skipped tests against the baseline
        # A skip is a pass to the build tool; this fails on one .github/skipped-tests.txt does not list, or a listed one that ran (#905).
        shell: bash
        run: $(command -v python3 || command -v python) .github/scripts/skipped_tests_gate.py . "consumer-fixture/jdk${{ matrix.java-version }}" consumer-fixture consumer-fixture-langs

      - name: Upload consumer fixture reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-consumer-fixture-reports-java-${{ matrix.java-version }}
          path: |
            consumer-fixture/target/surefire-reports/
            consumer-fixture-langs/*/target/surefire-reports/
          retention-days: 7

  junit-compatibility:
    name: JUnit ${{ matrix.junit-version }} (Java 21)
    runs-on: ubuntu-latest

    # The library compiles against Jupiter 6.x, but almost every codebase that would adopt it is
    # on the 5.x line. "Which JUnit versions do you support?" is the first question a platform
    # team asks, and before this job the repository had no answer: tests.yml matrixes the JDK and
    # never the Jupiter version. The consumer-fixture is the right subject because it resolves
    # async-test-lib as a downstream consumer does and exercises only the published surface.
    #
    # The floor is 5.9.3, verified by running this matrix rather than by reading release notes.
    # Publish any change to it in docs/BUILDING.md and docs/SUPPORT_POLICY.md.
    strategy:
      fail-fast: false
      matrix:
        junit-version: [ '5.9.3', '5.10.5', '5.11.4', '5.12.2', '5.13.4', '6.0.3', '6.1.2' ]

    env:
      ASYNC_TEST_TIMEOUT_MULTIPLIER: '1'

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install library to local Maven repository
        run: mvn -DskipTests clean install

      # Guards against the matrix quietly testing one version seven times: Maven resolves the
      # nearest declaration, and a mistake in the property plumbing would leave the transitive
      # 6.x in place while every cell still reported green.
      - name: Verify the declared Jupiter version is the resolved one
        run: |
          set -euo pipefail
          resolved=$(mvn \
                         "-Djunit.jupiter.version=${{ matrix.junit-version }}" \
                         -f consumer-fixture/pom.xml dependency:tree \
                     | grep -oE 'junit-jupiter-api:jar:[0-9.]+' | head -1 | cut -d: -f3)
          echo "declared=${{ matrix.junit-version }} resolved=${resolved}"
          test "${resolved}" = "${{ matrix.junit-version }}"

      - name: Run consumer fixture against JUnit ${{ matrix.junit-version }}
        run: |
          mvn \
              "-Djunit.jupiter.version=${{ matrix.junit-version }}" \
              -f consumer-fixture/pom.xml test

      - name: Check skipped tests against the baseline
        # A skip is a pass to the build tool; this fails on one .github/skipped-tests.txt does not list, or a listed one that ran (#905).
        shell: bash
        run: $(command -v python3 || command -v python) .github/scripts/skipped_tests_gate.py . "junit-compat/${{ matrix.junit-version }}" consumer-fixture

      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-junit-compat-${{ matrix.junit-version }}
          path: consumer-fixture/target/surefire-reports/
          retention-days: 7

  examples-detect:
    name: Detect changed examples (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      modules: ${{ steps.compute.outputs.modules }}
    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: shell
          filters: |
            examples:
              - 'examples/**'
            # A library change touches no examples/** path, yet every example consumes the
            # built artifact and can break because of it. Treated below as a reason to run a
            # sample rather than nothing.
            library:
              - 'async-test-lib/src/main/**'
              - 'async-test-agent/src/main/**'
              - 'async-test-analysis/src/main/**'
              - 'pom.xml'
              - 'build.gradle.kts'
            # The pipeline that runs the examples is itself a reason to run some. Without this,
            # a change to the sharding or to the filter above ships without building a single
            # example, and a change to this file cannot demonstrate its own effect.
            pipeline:
              - '.github/workflows/e2e-tests.yml'

      - name: Compute changed example modules
        id: compute
        run: |
          set -uo pipefail

          # 1. Examples this PR edited directly.
          changed=""
          if [ "${{ steps.filter.outputs.examples }}" = "true" ]; then
            changed=$(printf '%s\n' ${{ steps.filter.outputs.examples_files }} \
              | awk -F/ 'NF>=3 && $1=="examples" {print $2}' \
              | while read m; do if [ -f "examples/$m/pom.xml" ]; then echo "$m"; fi; done)
          fi

          # 2. A library change edits no examples/** path, but every example consumes the built
          #    artifact, so one can break all of them while this filter sees nothing. Run a
          #    deterministic every-4th sample, 37 of the 148 examples: enough to catch a
          #    systemic break at PR time, cheap enough to afford on every library PR. The full
          #    reactor still runs on push and nightly, so this moves discovery earlier rather
          #    than adding coverage.
          sample=""
          if [ "${{ steps.filter.outputs.library }}" = "true" ] \
             || [ "${{ steps.filter.outputs.pipeline }}" = "true" ]; then
            sample=$(ls -1 examples/*/pom.xml | awk -F/ '{print $2}' | sort | awk 'NR%4==1')
            echo "Library sources or this pipeline changed - sampling every 4th example project."
          fi

          modules=$(printf '%s\n%s\n' "$changed" "$sample" \
            | grep -v '^$' \
            | sort -u \
            | paste -sd ',' - || true)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          if [ -z "$modules" ]; then
            echo "No example projects to run."
          else
            echo "example modules to run: $modules"
          fi

  examples-changed:
    name: Examples Shard ${{ matrix.shard }} (PR)
    runs-on: ubuntu-latest
    needs: examples-detect
    if: github.event_name == 'pull_request' && needs.examples-detect.outputs.modules != ''

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21' ]
        shard: [ 0, 1, 2, 3 ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # The Kotlin example needs kotlin-compiler-embeddable (60 MB), and Central serves
          # that download on these runners as a redirect to release-assets: without the host,
          # Maven fails with "Connection refused" on it (#884). HardenRunnerEndpointsTest
          # requires it on every blocking job that builds the examples with Maven.
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      # setup-java's cache: maven is one entry shared by every job, keyed on the pom hashes and
      # never saved again after a hit, so the examples' dependencies (the Kotlin compiler among
      # them) came from Central on every run (#890). The library itself is never cached: each run
      # installs it from source, and a cached build of the same version must not stand in for it.
      # Restore only: a pull request builds just the examples it changed, so what it resolved is no
      # fit to save; examples-all fills the shard entries, and any of them holds the dependencies
      # every example shares.
      - name: Restore the examples' Maven dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/se/deversity
          key: maven-${{ runner.os }}-examples-shard${{ matrix.shard }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-examples-

      - name: Install library to local Maven repository
        run: mvn -DskipTests clean install

      - name: Run shard's slice of changed examples
        run: |
          set -euo pipefail
          TOTAL=4
          SHARD=${{ matrix.shard }}
          slice=$(echo "${{ needs.examples-detect.outputs.modules }}" \
            | tr ',' '\n' \
            | awk -v s="$SHARD" -v n="$TOTAL" 'NR%n==s' \
            | paste -sd ',' -)
          if [ -z "$slice" ]; then
            echo "Shard $SHARD has no modules in the changed set"
            exit 0
          fi
          echo "Shard $SHARD modules: $slice"
          mvn -f examples/pom.xml -pl "$slice" test -T 1C -fae "-Dasync-test.strict-detectors=true"

      - name: Upload shard test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-example-pr-reports-shard-${{ matrix.shard }}
          path: examples/*/target/surefire-reports/
          retention-days: 7

  examples-all:
    name: Examples Reactor (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'

    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21' ]
        shard: [ 0, 1, 2, 3 ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # The Kotlin example needs kotlin-compiler-embeddable (60 MB), and Central serves
          # that download on these runners as a redirect to release-assets: without the host,
          # Maven fails with "Connection refused" on it (#884). HardenRunnerEndpointsTest
          # requires it on every blocking job that builds the examples with Maven.
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      # setup-java's cache: maven is one entry shared by every job, keyed on the pom hashes and
      # never saved again after a hit, so this shard's examples (the Kotlin compiler among them)
      # came from Central on every run (#890). The library itself is never cached: each run installs
      # it from source, and a cached build of the same version must not stand in for it.
      - name: Cache this job's Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/se/deversity
          key: maven-${{ runner.os }}-examples-shard${{ matrix.shard }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-examples-shard${{ matrix.shard }}-

      - name: Install library to local Maven repository
        run: mvn -DskipTests clean install

      - name: Run example reactor shard
        run: |
          set -euo pipefail
          TOTAL=4
          SHARD=${{ matrix.shard }}
          modules=$(ls -1 examples/*/pom.xml \
            | awk -F/ '{print $2}' \
            | sort \
            | awk -v s="$SHARD" -v n="$TOTAL" 'NR%n==s' \
            | paste -sd ',' -)
          if [ -z "$modules" ]; then
            echo "Shard $SHARD has no modules"; exit 0
          fi
          echo "Shard $SHARD modules: $modules"
          mvn -f examples/pom.xml -pl "$modules" test -T 1C -fae "-Dasync-test.strict-detectors=true"

      - name: Upload shard test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-example-reactor-reports-shard-${{ matrix.shard }}
          path: examples/*/target/surefire-reports/
          retention-days: 7

  # The examples' baseline is JDK 21, so a JDK 24+ API cannot appear in any job above. Example
  # 116's jdk24-gatherer profile activates on JDK 24 or later and runs its real-Gatherer test
  # (#893); this leg is what executes it. It fails if the profile did not run that test, so a
  # profile that stops activating cannot pass by testing nothing.
  examples-jdk25:
    name: Examples on JDK 25 (JDK 24+ profiles)
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      # Its own key, as for examples-all (#890): only this job resolves on JDK 25, and the library
      # itself is never cached.
      - name: Cache this job's Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/se/deversity
          key: maven-${{ runner.os }}-examples-jdk25-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-examples-jdk25-

      - name: Install library to local Maven repository
        run: mvn -B -DskipTests clean install

      - name: Run the examples that carry a JDK 24+ profile
        run: |
          set -euo pipefail
          mvn -B -f examples/pom.xml -pl 116-gatherer-parallel-misuse test "-Dasync-test.strict-detectors=true"
          report=examples/116-gatherer-parallel-misuse/target/surefire-reports/TEST-se.deversity.asynctest.example.RealGathererTest.xml
          if [ ! -f "$report" ]; then
            echo "::error::RealGathererTest did not run; the jdk24-gatherer profile did not activate"
            exit 1
          fi
          grep -o 'tests="[0-9]*"[^>]*failures="[0-9]*"' "$report"

      - name: Upload test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-examples-jdk25-reports
          path: examples/*/target/surefire-reports/
          retention-days: 7

  e2e-summary:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ consumer-fixture, junit-compatibility, examples-detect, examples-changed, examples-all, examples-jdk25 ]
    # Runs even when a leg was skipped (examples-changed on push, examples-all on PR) so
    # there is one stable required check for the whole suite.
    if: always()
    steps:
      - name: Fail if any e2e leg failed
        run: |
          set -euo pipefail
          for result in \
            "consumer-fixture=${{ needs.consumer-fixture.result }}" \
            "junit-compatibility=${{ needs.junit-compatibility.result }}" \
            "examples-detect=${{ needs.examples-detect.result }}" \
            "examples-changed=${{ needs.examples-changed.result }}" \
            "examples-all=${{ needs.examples-all.result }}" \
            "examples-jdk25=${{ needs.examples-jdk25.result }}"; do
            name=${result%%=*}
            outcome=${result#*=}
            echo "$name: $outcome"
            case "$outcome" in
              success|skipped) ;;
              *) echo "::error::e2e leg $name reported $outcome"; exit 1 ;;
            esac
          done
