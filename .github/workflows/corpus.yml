name: Corpus Eval

# What the detectors say about code nobody here wrote.
#
# corpus-eval/ exercises third-party classes whose own javadoc states a thread-safety contract,
# under @AsyncTest, in three lanes per run: the agent attached; the same subjects with nothing
# attached, as the control the exposure table rests on; and a recording lane whose bodies call the
# recording API, which is a different measurement over a different denominator. The gates that must
# hold every run live in CorpusGates; the numbers are in the uploaded reports, one set per JDK, and
# the analysis is docs/analysis/corpus-eval.md.
#
# Its own workflow rather than a job in e2e-tests.yml, because this eval answers a question about
# the product rather than about the build: whether a finding on somebody else's code means their
# code is wrong. It publishes numbers that the README and the trust tiers both rest on - nine
# detectors carry VERDICT on the strength of pairs measured here - so it earns a history and a
# badge of its own, and a workflow_dispatch for running it against a library change without waiting
# for the whole end-to-end suite.
#
# The three JDKs are not decoration. The agent, the memory model and the scheduler all differ
# across releases, and the first cross-platform run of this eval disagreed with a local one in both
# directions for a reason that turned out to be a real defect (#316). A number without the platform
# it was taken on is not reproducible.
#
# "Corpus Eval" (the summary job below) is the stable required check for this workflow, mirroring
# "E2E Tests" in e2e-tests.yml. The per-JDK legs keep the names they had while this lived there, so
# any branch protection naming them individually is unaffected.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corpus-eval:
    name: Corpus Eval (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest

    # Three JDKs here where the rest of this workflow runs two. The eval publishes numbers,
    # and a number without the platform it was taken on is not reproducible: the agent, the
    # memory model and the scheduler all differ across releases. 26 is on the list because
    # docs/analysis/corpus-eval.md quotes a JDK 26 run, and a quoted number nobody re-runs is
    # a claim rather than a measurement.
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25', '26' ]

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Only the JDKs the runner image already caches are free. 26 is not cached, so
          # setup-java downloads it from a GitHub release asset, and without this host the
          # step fails before the eval runs at all.
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        id: setup-java
        # JDK 26 is on no runner image yet, so this leg resolves and downloads it from
        # api.adoptium.net on every run, while 21 and 25 come from the image cache. The action
        # has no retry of its own, so one DNS blip fails the job before a line of code runs:
        # "Error: Java setup process failed due to: getaddrinfo EAI_AGAIN api.adoptium.net",
        # seen on 2026-08-25 in a leg that had passed on the previous commit and in 21 of the
        # 22 preceding JDK 26 job runs. continue-on-error hands that case to the retry below.
        # A genuine outage or a wrong version still fails the job, because the retry does not
        # carry continue-on-error.
        continue-on-error: true
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Set up Java (retry after a transient resolver failure)
        if: steps.setup-java.outcome == 'failure'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Prepare local Maven repository
        shell: bash
        run: mkdir -p .m2/repository

      - name: Install library to local Maven repository
        run: mvn "-Dmaven.repo.local=.m2/repository" -DskipTests clean install

      # Measures what the detectors report on third-party classes whose javadoc states a
      # thread-safety contract. Three lanes per run: the agent attached; the same subjects with
      # nothing attached, as the control the exposure table rests on; and a recording lane whose
      # bodies do call the recording API, which is a different measurement over a different
      # denominator and writes its own report. The gates that must hold every run live in
      # CorpusGates; the numbers are in the uploaded reports, one set per JDK.
      - name: Run corpus eval
        run: mvn "-Dmaven.repo.local=.m2/repository" -f corpus-eval/pom.xml test

      - name: Upload corpus eval report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: corpus-eval-report-java-${{ matrix.java-version }}
          path: |
            corpus-eval/target/corpus-eval/
            corpus-eval/target/surefire-reports/
            corpus-eval/target/surefire-reports-agent-off/
            corpus-eval/target/surefire-reports-recording/
          retention-days: 7

  corpus-summary:
    name: Corpus Eval
    runs-on: ubuntu-latest
    needs: [ corpus-eval ]
    # Runs even when a leg was skipped or cancelled, so there is one stable required check for the
    # whole eval rather than three that branch protection has to be told about one JDK at a time.
    if: always()
    steps:
      - name: Fail if any corpus leg failed
        run: |
          set -euo pipefail
          outcome="${{ needs.corpus-eval.result }}"
          echo "corpus-eval: $outcome"
          case "$outcome" in
            success|skipped) ;;
            *) echo "::error::corpus eval reported $outcome"; exit 1 ;;
          esac
