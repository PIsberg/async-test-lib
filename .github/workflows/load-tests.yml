name: Load Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      asyncTestVersion:
        description: "Library version to test against (default: current build)"
        required: false
        default: "1.6.0"

permissions:
  contents: read

jobs:
  load-tests:
    name: Load Tests (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            downloads.gradle-dn.com:443
            github.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: wrapper

      - name: Build and publish library to local Maven repository
        run: ./gradlew publishToMavenLocal -x test

      - name: Run load tests (fast subset — capped for CI)
        run: |
          ./gradlew -p load-tests test \
            -PasyncTestVersion=${{ inputs.asyncTestVersion || '1.6.0' }} \
            -PloadTestFast=true

      - name: Upload throughput results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: load-test-results-${{ github.run_id }}
          path: |
            load-tests/results/**/*.csv
            load-tests/results/**/env.txt
          retention-days: 30

      - name: Upload test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: load-test-junit-reports-${{ github.run_id }}
          path: load-tests/build/reports/tests/
          retention-days: 7
