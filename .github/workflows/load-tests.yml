name: Load Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # The nightly ring of the performance contract: the same fast sweep, every night, compared
  # against the newest committed baseline under load-tests/results/ by
  # load-tests/tools/compare-baseline.sh. Warn-only, because baselines are cross-machine;
  # the inner-loop gate that fails a build is RunnerAllocationBudgetTest.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      asyncTestVersion:
        description: "Library version to test against. Leave empty to test the current build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  load-tests:
    name: Load Tests (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Block unexpected outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.adoptium.net:443
            api.github.com:443
            downloads.gradle-dn.com:443
            github.com:443
            objects.githubusercontent.com:443
            plugins.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: wrapper

      - name: Build and publish library to local Maven repository
        run: ./gradlew publishToMavenLocal -x test

      # No version is passed on push/pull_request, so load-tests/build.gradle.kts resolves it
      # from the reactor pom.xml — i.e. the build publishToMavenLocal just installed above.
      #
      # This used to read `-PasyncTestVersion=${{ inputs.asyncTestVersion || '1.6.0' }}`. The
      # inputs context is empty on automatic triggers, so every run pinned 1.6.0 and pulled it
      # from Maven Central, which made the publish step above dead weight and meant the load
      # tests had never measured HEAD since 1.6.0 — a throughput regression in the current build
      # was structurally invisible. Passing the input through only when it is set keeps the
      # workflow_dispatch escape hatch for benchmarking a published release.
      - name: Run load tests (fast subset — capped for CI)
        run: |
          set -euo pipefail
          ./gradlew -p load-tests test \
            ${{ inputs.asyncTestVersion && format('-PasyncTestVersion={0}', inputs.asyncTestVersion) || '' }} \
            -PloadTestFast=true

      # Trend line, not gate: compares the sweep just written (the newest results dir) with the
      # newest committed baseline and prints ::warning:: lines above the band. Exit code is
      # always 0 by design; read the step summary on scheduled runs.
      - name: Compare against the newest committed baseline (warn-only)
        if: always()
        run: |
          fresh="$(ls -td load-tests/results/*/ | grep -v _plots | head -1 | sed 's:/$::')"
          echo "## Load-test trend (fresh: $fresh)" >> "$GITHUB_STEP_SUMMARY"
          sh load-tests/tools/compare-baseline.sh "$fresh" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload throughput results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: load-test-results-${{ github.run_id }}
          path: |
            load-tests/results/**/*.csv
            load-tests/results/**/env.txt
          retention-days: 30

      - name: Upload test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: load-test-junit-reports-${{ github.run_id }}
          path: load-tests/build/reports/tests/
          retention-days: 7
